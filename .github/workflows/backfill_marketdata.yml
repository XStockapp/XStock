# Backfill del histórico de cadenas de opciones con interés abierto (MarketData.app → Supabase Storage).
# Corre una vez al día y a mano (Actions → «Backfill MarketData» → Run workflow). Se detiene sola antes de agotar
# los 100 000 créditos diarios y la siguiente ejecución sigue donde quedó (checkpoint en Supabase).
# Secrets del repositorio:
#   MARKETDATA_TOKEN                    → token de MarketData.app (nunca se imprime)
#   SUPABASE_URL, SUPABASE_SERVICE_KEY  → guarda los Parquet y el progreso (bucket «opciones», historico_oi/)
#   ALPACA_API_KEY, ALPACA_SECRET_KEY   → ordena el universo por liquidez (opcional: sin ellas, solo watchlist)
name: Backfill MarketData

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC: tras el reinicio diario de créditos y lejos del archivo diario (21:41)
  workflow_dispatch:
    inputs:
      max:
        description: "Acciones: watchlist + las más líquidas hasta este total"
        default: "150"
      anios:
        description: "Años hacia atrás"
        default: "3"
      limite:
        description: "Créditos máximos en esta ejecución (el plan da 100 000/día)"
        default: "95000"

concurrency:
  group: backfill-marketdata
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ml.txt
      - run: pip install -r requirements-ml.txt
      - name: Backfill
        env:
          MARKETDATA_TOKEN: ${{ secrets.MARKETDATA_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          if [ -z "$MARKETDATA_TOKEN" ]; then echo "Falta el secret MARKETDATA_TOKEN"; exit 1; fi
          if [ -z "$SUPABASE_URL" ]; then echo "Faltan los secrets de Supabase: sin ellos no hay dónde guardar el progreso"; exit 1; fi
          python scripts/backfill_marketdata_oi.py --max "${{ github.event.inputs.max || '150' }}" --anios "${{ github.event.inputs.anios || '3' }}" --limite "${{ github.event.inputs.limite || '95000' }}" --minutos 320
