# Archivo diario de la cadena de opciones (Motor B): resumen de IV, skew, interés abierto y spreads de las 200
# acciones más líquidas + las de tus watchlists, y la cadena completa de las tuyas + las 50 más líquidas.
# Corre de lunes a viernes después del cierre; en feriados detecta que no hubo mercado y no guarda nada.
name: Archivo de opciones

on:
  schedule:
    - cron: "41 21 * * 1-5"   # 21:41 UTC = 4:41 p. m. ET en invierno / 5:41 p. m. en verano
  workflow_dispatch:

jobs:
  archivar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Archivar
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python tools/archivar_opciones.py
